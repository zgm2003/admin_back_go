name: Verify database

env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOFLAGS: -mod=readonly
  ADMIN_DATABASE_VERIFY_MYSQL_IMAGE: mysql:8.4.10
  ADMIN_DATABASE_VERIFY_ATLAS_IMAGE: arigaio/atlas:0.38.0@sha256:9883fdf5290020022ad0ac91fe20b846d32f93c19f68dfd3cf3b327c3e1b7e1a

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  empty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: false
      - name: Verify canonical empty schema
        shell: pwsh
        run: ./scripts/verify-database.ps1 -Mode empty -OutputPath "${{ runner.temp }}/database-verification-empty.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-verification-empty-${{ github.sha }}
          path: ${{ runner.temp }}/database-verification-empty.json
          if-no-files-found: error
          retention-days: 7

  imported:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: false
      - name: Verify sanitized imported convergence
        shell: pwsh
        run: ./scripts/verify-database.ps1 -Mode imported -OutputPath "${{ runner.temp }}/database-verification-imported.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-verification-imported-${{ github.sha }}
          path: ${{ runner.temp }}/database-verification-imported.json
          if-no-files-found: error
          retention-days: 7
