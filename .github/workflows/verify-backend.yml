name: Verify backend

env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOFLAGS: -mod=readonly

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
          cache: false
      - name: Verify identity and route policy
        shell: pwsh
        run: ./scripts/verify-identity-routing.ps1
      - name: Verify runtime contracts from clean module cache
        shell: pwsh
        run: ./scripts/verify-go-clean.ps1
      - name: Verify durable work recovery
        shell: pwsh
        run: ./scripts/verify-durable-work.ps1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          tags: admin-go-backend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/admin-go-backend.tar
          build-args: BUILD_REVISION=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-go-backend-${{ github.sha }}
          path: /tmp/admin-go-backend.tar
          if-no-files-found: error
          retention-days: 7
