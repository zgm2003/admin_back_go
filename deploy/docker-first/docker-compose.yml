name: admin-go-backend

services:
  redis:
    image: redis:8.2.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:36379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  admin-api:
    image: admin-go-backend:local
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GO_BUILD_IMAGE: docker.m.daocloud.io/library/golang:1.26.5-bookworm
        GO_RUNTIME_IMAGE: docker.m.daocloud.io/library/debian:bookworm-slim
    command: ["/app/admin-api"]
    restart: unless-stopped
    env_file:
      - ./admin-go.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime:/app/runtime
      - ./exports:/app/exports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:8080/health >/dev/null; else python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\"; fi"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-worker:
    image: admin-go-backend:local
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GO_BUILD_IMAGE: docker.m.daocloud.io/library/golang:1.26.5-bookworm
        GO_RUNTIME_IMAGE: docker.m.daocloud.io/library/debian:bookworm-slim
    command: ["/app/admin-worker"]
    restart: unless-stopped
    env_file:
      - ./admin-go.env
    volumes:
      - ./runtime:/app/runtime
      - ./exports:/app/exports
    depends_on:
      admin-api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  redis-data:
