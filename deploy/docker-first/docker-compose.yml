name: admin-app

services:
  frontend:
    image: admin-frontend:local
    build:
      context: ../../../admin_front_ts
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: node:22.23.1-alpine
        NGINX_IMAGE: nginxinc/nginx-unprivileged:1.31.3-alpine
        VITE_GO_API_BASE_URL: http://localhost:5173
        VITE_WEB_SOCKET_URL: ws://localhost:5173/api/admin/v1/realtime/ws
        VITE_PLATFORM: admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    networks:
      - platform
    depends_on:
      admin-api:
        condition: service_healthy

  admin-api:
    image: admin-go-backend:local
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GO_BUILD_IMAGE: docker.m.daocloud.io/library/golang:1.26.5-bookworm
        GO_RUNTIME_IMAGE: docker.m.daocloud.io/library/debian:bookworm-slim
    command: ["/app/admin-api"]
    restart: unless-stopped
    env_file:
      - ./admin-go.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime:/app/runtime
      - ./exports:/app/exports
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:8080/health >/dev/null; else python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\"; fi"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-worker:
    image: admin-go-backend:local
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GO_BUILD_IMAGE: docker.m.daocloud.io/library/golang:1.26.5-bookworm
        GO_RUNTIME_IMAGE: docker.m.daocloud.io/library/debian:bookworm-slim
    command: ["/app/admin-worker"]
    restart: unless-stopped
    env_file:
      - ./admin-go.env
    volumes:
      - ./runtime:/app/runtime
      - ./exports:/app/exports
    networks:
      - platform
    depends_on:
      admin-api:
        condition: service_started

networks:
  platform:
    external: true
    name: admin-platform
