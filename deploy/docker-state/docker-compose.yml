name: admin-state

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: admin
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    ports:
      - "127.0.0.1:${ADMIN_MYSQL_HOST_PORT:-33306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/mysql_root_password) mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.2.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${ADMIN_REDIS_HOST_PORT:-36379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  platform:
    name: admin-platform

volumes:
  mysql-data:
  redis-data:

secrets:
  mysql_root_password:
    file: ./runtime/mysql-root-password.txt
